<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exemplo de fluxograma</title>
<style>
  body { margin: 0; padding: 24px 16px; font-family: Arial, sans-serif; background: #e9e9e9; color: #111; }
  h2 { font-size: 15px; font-weight: normal; color: #555; text-align: center; margin: 0 0 8px; }
  .cards { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
  /* simula o card do Anki: claro e modo noturno */
  .anki { width: 380px; max-width: 100%; padding: 20px; border-radius: 8px; font-size: 20px; text-align: center; box-sizing: border-box; }
  .claro { background: #fff; color: #000; }
  .noturno { background: #2f2f31; color: #e6e6e6; }
  hr { border: none; border-top: 1px solid #888; margin: 14px 0; }
  pre { max-width: 800px; margin: 28px auto 0; background: #fff; padding: 14px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<div class="cards">
 <div><h2>Anki: modo claro</h2><div class="anki claro" id="c1"></div></div>
 <div><h2>Anki: modo noturno</h2><div class="anki noturno" id="c2"></div></div>
</div>
<h2 style="margin-top:28px">HTML para colar no campo Verso (editor HTML: Ctrl+Shift+X)</h2>
<pre id="code"></pre>

<template id="verso"><div style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 15px;">
  <div style="border: 1px solid #888; border-radius: 6px; padding: 6px 10px; background: rgba(128,128,128,0.2);"><b>Suspeita</b> de síndrome compartimental</div>
  <div>↓</div>
  <div style="border: 1px solid #888; border-radius: 6px; padding: 6px 10px;">Abrir gesso/curativo <b>até a pele</b><br>Membro na <b>altura do coração</b> (não elevar)</div>
  <div>↓</div>
  <div style="border: 1px solid #888; border-radius: 6px; padding: 6px 10px;">Reavaliar</div>
  <div>↓</div>
  <div style="display: flex; gap: 10px; justify-content: center;">
    <div style="border: 1px solid #888; border-radius: 6px; padding: 6px 10px;">Melhorou<br>↓<br>Observar</div>
    <div style="border: 2px solid #c0392b; border-radius: 6px; padding: 6px 10px;">Sem melhora ou<br>ΔP &lt; 30 mmHg<br>↓<br><b>Fasciotomia</b> (urgência)</div>
  </div>
</div></template>

<script>
  const frente = 'Suspeita de síndrome compartimental em membro imobilizado: conduta?';
  const verso = document.getElementById('verso').innerHTML.trim();
  for (const id of ['c1', 'c2']) document.getElementById(id).innerHTML = frente + '<hr>' + verso;
  document.getElementById('code').textContent = verso;
</script>
</body>
</html>
